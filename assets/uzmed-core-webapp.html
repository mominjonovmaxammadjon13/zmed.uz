<!doctype html>
<html lang="uz">
<head><script src="/assets/uzmed-icons-20261025.js?v=2" data-uzmed-site-icons="20261025"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>UZMED ADMIN</title>
<link rel="stylesheet" href="/assets/uzmed-core.css?v=20261008-walk5">
<link rel="stylesheet" href="/assets/uzmed-core-pinterest-20261009.css?v=1">
<style>
html,body{margin:0;width:100%;height:100%;background:#070b14;color:#eef4ff;font-family:Inter,system-ui,-apple-system,sans-serif;overflow:hidden}
#tgGate{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#070b14;z-index:2147483600}
#tgGate .box{width:min(430px,100%);padding:22px;border-radius:18px;background:#0e1728;border:1px solid rgba(148,163,184,.16);box-shadow:0 20px 70px rgba(0,0,0,.35);text-align:center}
#tgGate .orb{width:48px;height:48px;margin:0 auto 14px;border-radius:15px;background:radial-gradient(circle at 35% 30%,#86efac,#22c55e 42%,#0f5132 72%);box-shadow:0 0 34px rgba(34,197,94,.28)}
#tgGate h1{font-size:20px;margin:0 0 7px}#tgGate p{color:#9caac3;margin:0;font-size:13px;line-height:1.55}
#tgGate.err .orb{background:radial-gradient(circle at 35% 30%,#fecaca,#ef4444 48%,#7f1d1d 75%)}
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/assets/uzmed-core-pinterest.css?v=20261009-clinic1">\n</head>
<body>
<div id="tgGate"><div class="box"><div class="orb"></div><h1>UZMED ADMIN</h1><p id="tgGateText">Admin huquqi tekshirilmoqda…</p></div></div>
<script>
(async function(){
  const gate=document.getElementById('tgGate'),msg=document.getElementById('tgGateText');
  function fail(text){gate.classList.add('err');msg.textContent=text;}
  try{
    const tg=window.Telegram&&window.Telegram.WebApp;
    if(!tg||!tg.initData){fail('Bu panel faqat UZMED Admin Telegram botidan ochiladi.');return;}
    try{tg.ready();tg.expand();tg.setHeaderColor&&tg.setHeaderColor('#070b14');tg.setBackgroundColor&&tg.setBackgroundColor('#070b14');}catch(_){}
    const r=await fetch('/api/core/telegram-login',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({init_data:tg.initData}),cache:'no-store'});
    const data=await r.json().catch(()=>({}));
    if(!r.ok||!data.token){fail(r.status===403?'Bu Telegram akkauntiga admin ruxsati berilmagan.':'Admin sessiyasini tasdiqlab bo‘lmadi. Botdan qayta oching.');return;}
    window.__UZMED_TG_ADMIN_TOKEN=data.token;
    const js=document.createElement('script');js.src='/assets/uzmed-core.js?v=20261013-neon1';js.onload=function(){
      try{gate.remove();window.UZMEDCore.open('3d');}catch(e){fail('3D boshqaruv paneli ochilmadi.');}
    };js.onerror=function(){fail('UZMED CORE fayli yuklanmadi.');};document.body.appendChild(js);
  }catch(e){fail('UZMED CORE ga kirishda xato yuz berdi.');}
})();
</script>
<script src="/assets/uzmed-voice-guide-v1.js?v=20261102-sardor-0bc44b57b02f" defer></script>
</body>
</html>
